apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/description: Every container needs CPU/memory requests and a memory limit, so the scheduler and Auto Mode size nodes correctly and no pod can starve others.
spec:
  background: true
  rules:
    - name: check-resources
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["portfolio-*"]
      validate:
        failureAction: Enforce
        message: "CPU and memory requests, and a memory limit, are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    memory: "?*"
