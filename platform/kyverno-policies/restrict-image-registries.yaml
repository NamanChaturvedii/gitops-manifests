apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: portfolio-namespaces-only
      expression: "request.namespace.startsWith('portfolio-')"
  validations:
    - expression: "object.spec.containers.all(c, c.image.startsWith('287629436195.dkr.ecr.ap-south-1.amazonaws.com/'))"
      message: "Images must come from our ECR (287629436195.dkr.ecr.ap-south-1.amazonaws.com), where only scanned images are pushed."
