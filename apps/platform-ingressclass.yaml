apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ingressclass
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NamanChaturvedii/gitops-manifests.git
    targetRevision: main
    path: platform/ingressclass
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
