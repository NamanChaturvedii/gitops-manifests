apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NamanChaturvedii/gitops-manifests.git
    targetRevision: main
    path: charts/portfolio
    helm:
      releaseName: portfolio
      valueFiles:
        - ../../envs/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-prod
  syncPolicy:           # prod: NO automated block = manual sync (human approves)
    syncOptions:
      - CreateNamespace=true
